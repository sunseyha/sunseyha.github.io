<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sun Seyha's academic homepage. Master's student at Beijing Institute of Technology."
    />
    <title>Sun Seyha | Academic Homepage</title>
    <style>
      :root {
        color-scheme: light;
        --background: #fff;
        --text: #303438;
        --heading: #22272b;
        --muted: #62686c;
        --link: #38576b;
        --link-hover: #202b33;
        --border: #dedfe0;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --background: #191c1f;
        --text: #d3d7da;
        --heading: #eef0f2;
        --muted: #a2aab0;
        --link: #a1bacb;
        --link-hover: #dce7ee;
        --border: #3b4248;
      }
      .name-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }
      .name-row h1 {
        margin-bottom: 0;
      }
      .theme-toggle {
        display: inline-flex;
        flex-shrink: 0;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        padding: 7px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }
      .theme-toggle:hover {
        color: var(--heading);
        border-color: var(--muted);
      }
      .theme-toggle:focus-visible {
        outline: 2px solid var(--link);
        outline-offset: 3px;
      }
      .theme-toggle svg {
        width: 20px;
        height: 20px;
      }
      .theme-toggle .sun-icon {
        display: none;
      }
      :root[data-theme="dark"] .theme-toggle .sun-icon {
        display: block;
      }
      :root[data-theme="dark"] .theme-toggle .moon-icon {
        display: none;
      }

      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation: none;
        mix-blend-mode: normal;
      }
      ::view-transition-old(root) {
        z-index: 1;
      }
      ::view-transition-new(root) {
        z-index: 2;
      }
      ::view-transition-image-pair(root) {
        isolation: auto;
      }
      * {
        box-sizing: border-box;
      }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        margin: 0;
        background: var(--background);
        color: var(--text);
        font-family: "Segoe UI", Arial, sans-serif;
        font-size: 18px;
        line-height: 1.7;
      }
      a {
        color: var(--link);
        text-decoration-thickness: 1px;
        text-underline-offset: 4px;
      }
      a:hover {
        color: var(--link-hover);
        text-decoration: underline;
      }
      a:focus-visible {
        outline: 2px solid var(--link);
        outline-offset: 5px;
      }
      .page {
        flex: 1;
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        gap: 72px;
        width: calc(100% - 80px);
        max-width: 1080px;
        margin: 64px auto 72px;
      }
      .sidebar {
        position: sticky;
        top: 32px;
        align-self: start;
        max-height: calc(100dvh - 64px);
        overflow-y: auto;
        padding-right: 32px;
        border-right: 1px solid var(--border);
      }
      h1 {
        margin: 0 0 8px;
        color: var(--heading);
        font-size: 36px;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: -1px;
      }
      .sidebar header > p {
        margin: 0 0 16px;
      }
      .sidebar header > p:first-of-type {
        color: var(--muted);
        font-size: 16px;
      }
      .subtitle {
        font-size: 16px;
      }
      .navigation {
        display: grid;
        gap: 4px;
        margin: 28px 0 32px;
      }
      .navigation a {
        position: relative;
        flex-shrink: 0;
        width: fit-content;
        padding: 3px 0;
        white-space: nowrap;
        text-decoration: none;
      }
      .navigation .glitch-overlay {
        position: absolute;
        inset: 3px 0;
        overflow: hidden;
        white-space: nowrap;
        pointer-events: none;
      }
      .navigation a.is-glitching .nav-label {
        visibility: hidden;
      }
      .navigation a[aria-current="page"] {
        color: var(--heading);
        font-weight: 600;
        text-decoration: underline;
      }
      .navigation a:hover {
        text-decoration: underline;
      }
      .sidebar h2 {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .social {
        margin-bottom: 28px;
      }
      .social-links {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
      }
      .social-links a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 32px;
        min-height: 36px;
        color: var(--muted);
      }
      .social-links a:hover {
        color: var(--heading);
      }
      .social-links svg {
        width: 22px;
        height: 22px;
      }
      .contact {
        font-size: 16px;
      }
      .contact address {
        font-style: normal;
      }
      .portrait {
        display: block;
        width: 180px;
        max-width: 100%;
        height: auto;
        margin: 0 0 28px;
      }
      .content {
        min-width: 0;
      }
      .content p {
        max-width: 62ch;
        margin: 0 0 20px;
      }
      .content h2 {
        margin: 0 0 24px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--border);
        color: var(--heading);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 30px;
        font-weight: 400;
        line-height: 1.3;
      }
      .content h3 {
        margin: 28px 0 10px;
        color: var(--text);
        font-size: 20px;
        font-weight: 600;
      }
      #project-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr));
        gap: 16px;
      }
      .project-card {
        display: block;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .content .project-card h3 {
        margin: 0 0 8px;
      }
      .project-card:hover,
      .project-card:focus-visible {
        border-color: var(--heading);
      }
      .project-meta {
        color: var(--muted);
        font-size: 14px;
      }
      .content [hidden],
      #project-list[hidden] {
        display: none;
      }
      .footer {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px 24px;
        width: calc(100% - 80px);
        max-width: 1080px;
        margin: 0 auto;
        padding: 20px 0 24px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 14px;
      }
      @media (max-width: 900px) {
        .page {
          grid-template-columns: 240px minmax(0, 1fr);
          gap: 36px;
          width: calc(100% - 48px);
          margin-top: 40px;
        }
        .sidebar {
          padding-right: 24px;
        }
        .footer {
          width: calc(100% - 48px);
        }
      }
      @media (max-width: 640px) {
        body {
          font-size: 16px;
        }
        .page {
          grid-template-columns: 1fr;
          gap: 32px;
          margin: 32px auto 48px;
        }
        .sidebar {
          position: static;
          max-height: none;
          overflow-y: visible;
          padding: 0 0 24px;
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }
        h1 {
          font-size: 32px;
        }
        .navigation {
          display: flex;
          flex-wrap: wrap;
          gap: 8px 22px;
          margin: 20px 0 24px;
        }
        .social {
          margin-bottom: 20px;
        }
        .portrait {
          width: 160px;
        }
        .content h2 {
          font-size: 28px;
        }
      }
      #home > h2 {
        position: relative;
      }
      .portrait-placeholder {
        display: none;
      }
      @media (min-width: 641px) {
        #home > h2 {
          min-height: 82px;
          padding-right: 80px;
        }
        #home > h2 .portrait {
          position: absolute;
          right: 0;
          top: 0;
          width: 56px;
          max-height: 68px;
          object-fit: contain;
          margin: 0;
        }

        body {
          height: 100dvh;
          min-height: 0;
          overflow: hidden;
        }
        .page {
          min-height: 0;
          grid-template-rows: minmax(0, 1fr);
          margin-top: 32px;
          margin-bottom: 24px;
        }
        .sidebar {
          position: static;
          max-height: 100%;
        }
        .content {
          min-height: 0;
          overflow: hidden;
        }
        .content > section {
          display: flex;
          flex-direction: column;
          height: 100%;
          min-height: 0;
        }
        .content > section > h2 {
          flex-shrink: 0;
        }
        .section-body {
          flex: 1;
          min-height: 0;
          overflow-y: auto;
          scrollbar-gutter: stable;
          padding-right: 16px;
        }
        .footer {
          flex-shrink: 0;
        }
      }
    </style>
  </head>

    <script>
      // Theme is intentionally not persisted: every load starts light.
      const themeToggle = document.querySelector(".theme-toggle");
      document.documentElement.dataset.theme = "light";
      let themeChanging = false;
      themeToggle.addEventListener("click", async (event) => {
        if (themeChanging) return;
        const applyTheme = () => {
          const dark = document.documentElement.dataset.theme !== "dark";
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          const label = dark ? "Switch to light theme" : "Switch to dark theme";
          themeToggle.setAttribute("aria-pressed", String(dark));
          themeToggle.setAttribute("aria-label", label);
          themeToggle.title = label;
        };
        if (
          !document.startViewTransition ||
          window.matchMedia("(prefers-reduced-motion: reduce)").matches
        ) {
          applyTheme();
          return;
        }
        const rect = themeToggle.getBoundingClientRect();
        const x = event.detail ? event.clientX : rect.left + rect.width / 2;
        const y = event.detail ? event.clientY : rect.top + rect.height / 2;
        const radius = Math.hypot(
          Math.max(x, window.innerWidth - x),
          Math.max(y, window.innerHeight - y),
        );
        themeChanging = true;
        let transition;
        try {
          transition = document.startViewTransition(applyTheme);
          await transition.ready;
          // One continuous expansion with a gentle slowdown.
          const circle = (progress) => `circle(${radius * progress}px at ${x}px ${y}px)`;
          const reveal = document.documentElement.animate(
            [
              { clipPath: circle(0) },
              { clipPath: circle(1) },
            ],
            {
              duration: 800,
              easing: "cubic-bezier(.22, .1, .25, 1)",
              pseudoElement: "::view-transition-new(root)",
            },
          );
          await reveal.finished;
          await transition.finished;
        } catch {
          // A skipped snapshot still applies the new theme.
          if (transition) {
            transition.skipTransition();
            await transition.updateCallbackDone.catch(() => {});
          } else {
            applyTheme();
          }
        } finally {
          themeChanging = false;
        }
      });

      async function initializePages() {
        const pages = ["home", "project", "cv", "code", "personal"];
        const fragments = await Promise.all(pages.map(async (page) => {
          const response = await fetch(page + ".html");
          if (!response.ok) throw new Error("Could not load " + page);
          return response.text();
        }));
        document.getElementById("main-content").innerHTML = fragments.join("");
        setupNavigation();
      }

      function setupNavigation() {
        const sections = [...document.querySelectorAll(".content > section")];
        const navigationLinks = [...document.querySelectorAll(".navigation a")];

        const glitchSymbols = '@#$%&(){}|:"<>?!';

        navigationLinks.forEach((link) => {
          const label = link.textContent;
          let glitchTimer;
          const labelSpan = document.createElement("span");
          labelSpan.className = "nav-label";
          labelSpan.textContent = label;
          const overlay = document.createElement("span");
          overlay.className = "glitch-overlay";
          overlay.setAttribute("aria-hidden", "true");
          link.replaceChildren(labelSpan, overlay);

          link.setAttribute("aria-label", label);

          function stopGlitch() {
            clearInterval(glitchTimer);
            overlay.textContent = "";
            link.classList.remove("is-glitching");
          }

          function startGlitch() {
            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches)
              return;

            stopGlitch();
            link.classList.add("is-glitching");
            let frame = 0;

            function scramble() {
              overlay.textContent = [...label]
                .map((character, index) =>
                  index < Math.floor((frame / 12) * label.length)
                    ? character
                    : glitchSymbols[
                        Math.floor(Math.random() * glitchSymbols.length)
                      ],
                )
                .join("");

              if (frame++ >= 12) stopGlitch();
            }

            scramble();
            glitchTimer = setInterval(scramble, 40);
          }

          link.addEventListener("mouseenter", startGlitch);

          link.addEventListener("mouseleave", stopGlitch);
        });

        function showPage() {
          const route = window.location.hash.slice(1) || "home";
          const isProjectRoute = route === "project" || route.startsWith("project/");
          const requestedPage = isProjectRoute ? "project" : route;
          const page = sections.some((section) => section.id === requestedPage)
            ? requestedPage
            : "home";

          sections.forEach((section) => {
            section.hidden = section.id !== page;
          });
          if (isProjectRoute) {
            showProject(route.slice("project/".length));
          }
          navigationLinks.forEach((link) => {
            if (link.hash === "#" + page) {
              link.setAttribute("aria-current", "page");
            } else {
              link.removeAttribute("aria-current");
            }
          });
        }

        const aboutBody = document.querySelector("#home .section-body");
        const aboutHeading = document.querySelector("#home > h2");
        const portrait = document.querySelector("#home .portrait");
        const portraitPlaceholder = document.createElement("div");
        portraitPlaceholder.className = "portrait-placeholder";
        portraitPlaceholder.setAttribute("aria-hidden", "true");
        portrait.after(portraitPlaceholder);
        const desktopLayout = window.matchMedia("(min-width: 641px)");
        let portraitDocked = false;

        function updatePortrait() {
          const shouldDock = desktopLayout.matches && aboutBody.scrollTop > 24;
          if (shouldDock === portraitDocked) return;
          if (shouldDock) {
            // Preserve the photo's space so docking does not jump the scroll position.
            portraitPlaceholder.style.height = `${portrait.offsetHeight + 28}px`;
            portraitPlaceholder.style.display = "block";
            aboutHeading.append(portrait);
          } else {
            portraitPlaceholder.before(portrait);
            portraitPlaceholder.style.display = "none";
          }
          portraitDocked = shouldDock;
        }
        aboutBody.addEventListener("scroll", updatePortrait, { passive: true });
        desktopLayout.addEventListener("change", updatePortrait);

        window.addEventListener("hashchange", showPage);
        showPage();
      }

      initializePages().catch((error) => {
        console.error(error);
        document.getElementById("main-content").textContent =
          "Could not load the page content. Open this site through a web server.";
      });
    </script>
